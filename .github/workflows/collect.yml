# OPC 官方来源每日巡检（示例）
# 前置：目录已 git init 并推送 GitHub；需 commit 权限（默认 GITHUB_TOKEN 可用）。
name: opc-collect

on:
  schedule:
    - cron: "0 2 * * *" # 每天北京时间 10:00（UTC 02:00）
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run collector
        run: npm run collect

      - name: Commit changes (pool / last-report)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(collect): 巡检更新 pool/last-report"
          file_pattern: "data/pool/*.json"
          commit_user_name: "opc-collector[bot]"
          commit_user_email: "actions@users.noreply.github.com"

      - name: Verify data integrity and quality
        run: |
          npm test
          npm run check:data
