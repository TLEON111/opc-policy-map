# OPC 官方来源每日巡检（正式定时任务）
# 注意：GitHub Actions 的 schedule 为“尽量准时”，可能延迟数分钟（极端时更长），
# 不保证严格整点；如需精确 10:00 触发，请用外部 cron 调用 workflow_dispatch。
# 兜底：collect-guard.yml 每 2 小时检查今日是否已巡检，漏跑自动补触发本工作流。
name: opc-collect

on:
  schedule:
    - cron: "50 1 * * *" # 每天北京时间 09:50 启动，巡检约在 10:00 前完成数据更新
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run collector
        run: npm run collect

      - name: Commit changes (pool / last-report)
        # 失败不阻断后续（可能与外部 push 撞车产生竞态；数据仍会随下次 push 提交）
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore(collect): 巡检更新 pool/last-report"
          file_pattern: "data/pool/*.json"
          commit_user_name: "opc-collector[bot]"
          commit_user_email: "actions@users.noreply.github.com"

      - name: Sync daily pool updates to Supabase
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            npm run sync:supabase
          else
            echo "跳过 Supabase 同步（未配置 SUPABASE_URL / SUPABASE_SERVICE_KEY）"
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Verify data integrity and quality
        run: |
          npm test
          npm run check:data
